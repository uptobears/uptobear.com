name: site
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: index the chain (skipped until the contracts are configured)
        run: |
          if python3 -c "import json,sys;c=json.load(open('script/ops/config.json'));sys.exit(0 if int(c['den'],16) else 1)"; then
            python3 script/ops/indexer.py
          else
            echo "not launched yet: serving the site with sample data"
          fi
      - name: commit runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/state.json web/logos script/ops/indexer.db.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -qm "indexer: $(date -u +%FT%H:%MZ)" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
